name: "Zombie Shooter"

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npm install --save-dev electron electron-builder @capacitor-community/electron

      - name: Build Web Application
        run: |
          npm run build --if-present
        shell: pwsh

      - name: Prepare Electron Directory & Copy Web Assets
        run: |
          New-Item -ItemType Directory -Force -Path "electron-app/www"

          # Search for index.html in common web output directories or current directory
          if (Test-Path "www/index.html") {
              Copy-Item -Path "www/*" -Destination "electron-app/www/" -Recurse -Force
          } elseif (Test-Path "dist/index.html") {
              Copy-Item -Path "dist/*" -Destination "electron-app/www/" -Recurse -Force
          } elseif (Test-Path "build/index.html") {
              Copy-Item -Path "build/*" -Destination "electron-app/www/" -Recurse -Force
          } elseif (Test-Path "index.html") {
              Copy-Item -Path "*" -Destination "electron-app/www/" -Recurse -Force
          }

          # Remove default root index.html inside electron-app to prevent path conflicts
          if (Test-Path "electron-app/index.html") {
              Remove-Item "electron-app/index.html" -Force
          }
        shell: pwsh

      - name: Fix Index.html Relative Paths
        run: |
          $htmlPath = "electron-app/www/index.html"
          if (Test-Path $htmlPath) {
              $content = Get-Content $htmlPath -Raw
              # Remove base href tag if present
              $content = $content -replace '<base href="[^"]*"\s*/?>', ''
              # Replace absolute src/href paths with relative paths
              $content = $content -replace 'src="/', 'src="./'
              $content = $content -replace 'href="/', 'href="./'
              Set-Content -Path $htmlPath -Value $content
          }
        shell: pwsh

      - name: Create Direct Electron Entry Point & Configuration
        run: |
          $appDir = "electron-app"
          
          $mainJs = @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          const fs = require('fs');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 720,
              webPreferences: {
                nodeIntegration: true,
                contextIsolation: false,
                webSecurity: false
              }
            });

            const indexPath = path.join(__dirname, 'www', 'index.html');
            
            if (fs.existsSync(indexPath)) {
              win.loadFile(indexPath);
            } else {
              win.loadURL('data:text/html,<h2>Error: www/index.html still not found! Path searched: ' + indexPath + '</h2>');
            }

            win.webContents.openDevTools();
          }

          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          "@

          Set-Content -Path "$appDir/main.js" -Value $mainJs
          # Explicitly define files to include www folder in the packaged build
          Set-Content -Path "$appDir/package.json" -Value '{"name": "zombie-shooter", "version": "1.0.0", "main": "main.js", "files": ["**/*"]}'
        shell: pwsh

      - name: Configure Electron Builder Properties
        run: |
          $packageJsonPath = "package.json"
          $json = Get-Content $packageJsonPath -Raw | ConvertFrom-Json
          
          if (-not $json.build) {
              $json | Add-Member -NotePropertyName "build" -NotePropertyValue (@{
                  appId = "com.zombieshooter.app"
                  productName = "Zombie Shooter"
                  directories = @{
                      app = "electron-app"
                  }
                  files = @(
                      "electron-app/**/*"
                  )
                  win = @{
                      artifactName = 'Zombie-Shooter-Setup-${version}.${ext}'
                  }
                  nsis = @{
                      oneClick = $false
                      allowToChangeInstallationDirectory = $true
                      createDesktopShortcut = $true
                      createStartMenuShortcut = $true
                  }
              })
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content $packageJsonPath
        shell: pwsh

      - name: Package Executable via Electron Builder
        run: |
          npx electron-builder --win --dir=false --publish never
        shell: pwsh

      - name: Locate and Prepare Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path "release_artifacts"
          Get-ChildItem -Path "dist" -Recurse -Include *.exe, *.msi | Copy-Item -Destination "release_artifacts" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Shooter-Windows-Installer
          path: release_artifacts/*
