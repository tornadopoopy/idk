name: "Zombie Shooter"

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npm install --save-dev electron electron-builder @capacitor-community/electron

      - name: Initialize Capacitor Electron Platform
        run: |
          npx cap add @capacitor-community/electron || true
          npx cap sync @capacitor-community/electron

      - name: Build Web Assets and Copy to Electron
        run: |
          npx cap copy @capacitor-community/electron
          if (Test-Path "www") {
              New-Item -ItemType Directory -Force -Path "electron-app/www"
              Copy-Item -Path "www/*" -Destination "electron-app/www/" -Recurse -Force
          }
        shell: pwsh

      - name: Fix Index.html Relative Paths
        run: |
          $htmlPath = "electron-app/www/index.html"
          if (Test-Path $htmlPath) {
              $content = Get-Content $htmlPath -Raw
              # Remove base href tag if present
              $content = $content -replace '<base href="[^"]*"\s*/?>', ''
              # Replace absolute src/href paths with relative paths
              $content = $content -replace 'src="/', 'src="./'
              $content = $content -replace 'href="/', 'href="./'
              Set-Content -Path $htmlPath -Value $content
          }
        shell: pwsh

      - name: Create Direct Electron Entry Point
        run: |
          $appDir = "electron-app"
          New-Item -ItemType Directory -Force -Path $appDir
          
          $mainJs = @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          const fs = require('fs');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 720,
              webPreferences: {
                nodeIntegration: true,
                contextIsolation: false,
                webSecurity: false
              }
            });

            // Locate index.html across production and development build roots
            let indexPath = path.join(__dirname, 'www', 'index.html');
            if (!fs.existsSync(indexPath)) {
              indexPath = path.join(__dirname, 'index.html');
            }

            win.loadFile(indexPath);

            // Opens DevTools to expose missing files or JavaScript errors
            win.webContents.openDevTools();
          }

          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          "@

          Set-Content -Path "$appDir/main.js" -Value $mainJs
          Set-Content -Path "$appDir/package.json" -Value '{"name": "zombie-shooter", "version": "1.0.0", "main": "main.js"}'
        shell: pwsh

      - name: Configure Electron Builder Properties
        run: |
          $packageJsonPath = "package.json"
          $json = Get-Content $packageJsonPath -Raw | ConvertFrom-Json
          
          if (-not $json.build) {
              $json | Add-Member -NotePropertyName "build" -NotePropertyValue (@{
                  appId = "com.zombieshooter.app"
                  productName = "Zombie Shooter"
                  directories = @{
                      app = "electron-app"
                  }
                  win = @{
                      artifactName = 'Zombie-Shooter-Setup-${version}.${ext}'
                  }
                  nsis = @{
                      oneClick = $false
                      allowToChangeInstallationDirectory = $true
                      createDesktopShortcut = $true
                      createStartMenuShortcut = $true
                  }
              })
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content $packageJsonPath
        shell: pwsh

      - name: Package Executable via Electron Builder
        run: |
          npx electron-builder --win --dir=false --publish never
        shell: pwsh

      - name: Locate and Prepare Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path "release_artifacts"
          Get-ChildItem -Path "dist" -Recurse -Include *.exe, *.msi | Copy-Item -Destination "release_artifacts" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Shooter-Windows-Installer
          path: release_artifacts/*
